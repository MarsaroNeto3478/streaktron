<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="streaky-titulo" id="streaky">
  <title id="streaky-titulo">Streaky pensativo</title>
  <style>
    #streaky {
      --contorno: #6B1020;      /* vinho */
      --borda: #E8262B;         /* vermelho das bordas */
      --corpo: #FF4D2D;         /* vermelho-alaranjado */
      --laranja: #FF8A1F;       /* miolo laranja */
      --miolo: #FFB938;
      --centro: #FFF1A8;        /* amarelo-claro do centro */
      --olho: #FFFFFF;
      --pupila: #2A0710;
      --boca: #7A0F1F;
      --lingua: #FFD166;
    }

    /* Animações: leves, em loop, só CSS. */
    #flutua { animation: flutua 3.2s ease-in-out infinite; }
    #chama { transform-origin: 256px 440px; animation: oscila 2.6s ease-in-out infinite; }
    #chama-interna { transform-origin: 256px 420px; animation: pulsa 1.8s ease-in-out infinite; }
    #olhos { transform-box: fill-box; transform-origin: center; animation: pisca 5s infinite; }

    @keyframes flutua { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes oscila {
      0%, 100% { transform: skewX(0) scale(1, 1); }
      25% { transform: skewX(-2deg) scale(1.01, .99); }
      75% { transform: skewX(2deg) scale(.99, 1.01); }
    }
    @keyframes pulsa { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03, .97); } }
    @keyframes pisca { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.08); } }
    #chama { transform-origin: 268px 470px; animation: pensa 3.6s ease-in-out infinite; }
    @keyframes pensa { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

    @media (prefers-reduced-motion: reduce) {
      #streaky * { animation: none !important; }
    }
  </style>

  <defs>
    <!-- Do amarelo-claro no centro ao vermelho nas bordas -->
    <radialGradient id="grad-corpo" cx="256" cy="330" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color: var(--centro)"/>
      <stop offset=".32" style="stop-color: var(--miolo)"/>
      <stop offset=".6" style="stop-color: var(--corpo)"/>
      <stop offset="1" style="stop-color: var(--borda)"/>
    </radialGradient>
    <radialGradient id="grad-interna" cx="256" cy="345" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color: var(--centro)"/>
      <stop offset=".55" style="stop-color: var(--miolo)"/>
      <stop offset="1" style="stop-color: var(--laranja)"/>
    </radialGradient>
    <linearGradient id="grad-brilho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="grad-sombra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--contorno)" stop-opacity="0"/>
      <stop offset="1" style="stop-color: var(--contorno)" stop-opacity=".35"/>
    </linearGradient>
    <!-- Três pontas: esquerda pequena, principal curvada como um topete, direita média -->
    <path id="forma-corpo" d="M256 446
      C178 446 120 396 120 324
      C120 266 138 228 146 166
      C164 190 182 200 202 206
      C198 150 226 100 272 76
      C294 64 316 58 338 64
      C316 72 298 88 292 110
      C286 132 296 150 312 166
      C338 160 366 150 392 128
      C384 170 394 214 394 270
      C394 380 332 446 256 446 Z"/>
    <clipPath id="recorte-corpo"><use href="#forma-corpo"/></clipPath>
    <filter id="suave" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <g id="flutua">
    <g id="chama">
      <g transform="translate(256 280) scale(.88) translate(-256 -280)">
      <g id="corpo">
        <path d="M146 214 C146 128 200 86 264 86 C336 86 382 132 382 192 C382 250 336 274 300 298 C278 314 268 330 268 356" fill="none" stroke="var(--contorno)" stroke-width="140" stroke-linecap="round"/>
        <path d="M146 214 C146 128 200 86 264 86 C336 86 382 132 382 192 C382 250 336 274 300 298 C278 314 268 330 268 356" fill="none" stroke="var(--borda)" stroke-width="121" stroke-linecap="round"/>
        <path d="M146 214 C146 128 200 86 264 86 C336 86 382 132 382 192 C382 250 336 274 300 298 C278 314 268 330 268 356" fill="none" stroke="var(--corpo)" stroke-width="104" stroke-linecap="round"/>
      </g>
      <g id="chama-interna" fill="none" stroke-linecap="round" filter="url(#suave)">
        <path d="M146 214 C146 128 200 86 264 86 C336 86 382 132 382 192 C382 250 336 274 300 298 C278 314 268 330 268 356" stroke="var(--laranja)" stroke-width="70"/>
        <path d="M146 214 C146 128 200 86 264 86 C336 86 382 132 382 192 C382 250 336 274 300 298 C278 314 268 330 268 356" stroke="var(--miolo)" stroke-width="44"/>
        <path d="M146 214 C146 128 200 86 264 86 C336 86 382 132 382 192 C382 250 336 274 300 298 C278 314 268 330 268 356" stroke="var(--centro)" stroke-width="18"/>
      </g>
      <!-- brilho no alto do gancho -->
      <path d="M176 156 C188 128 204 112 222 102" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".5"/>
      <!-- o ponto: um Streaky pequenininho -->
      <g id="ponto" transform="translate(268 498) scale(.2) translate(-256 -446)">
        <use href="#forma-corpo" fill="url(#grad-corpo)" stroke="var(--contorno)" stroke-width="48" stroke-linejoin="round"/>
      </g>
      <g id="olhos">
        <g id="olho-esquerdo">
          <ellipse cx="236" cy="88" rx="24.599999999999998" ry="29.52" fill="var(--olho)"/>
          <ellipse cx="240.92" cy="80.62" rx="13.94" ry="16.4" fill="var(--pupila)"/>
          <circle cx="245.83999999999997" cy="73.24000000000001" r="5.33" fill="#fff"/>
          <ellipse cx="236" cy="88" rx="24.599999999999998" ry="29.52" fill="none" stroke="var(--contorno)" stroke-width="7"/>
        </g>
        <g id="olho-direito">
          <ellipse cx="298" cy="84" rx="24.599999999999998" ry="29.52" fill="var(--olho)"/>
          <ellipse cx="302.92" cy="76.62" rx="13.94" ry="16.4" fill="var(--pupila)"/>
          <circle cx="307.84000000000003" cy="69.24000000000001" r="5.33" fill="#fff"/>
          <ellipse cx="298" cy="84" rx="24.599999999999998" ry="29.52" fill="none" stroke="var(--contorno)" stroke-width="7"/>
        </g>
      </g>
      <!-- a direita mais erguida: pensando -->
      <g id="sobrancelhas" fill="none" stroke="var(--contorno)" stroke-width="9" stroke-linecap="round">
        <path d="M212 50 Q236 36 258 48"/>
        <path d="M278 40 Q300 22 322 34"/>
      </g>
      <!-- boquinha de lado -->
      <g id="boca">
        <path d="M258 132 Q272 124 286 130" fill="none" stroke="var(--contorno)" stroke-width="8" stroke-linecap="round"/>
      </g>
      </g>
    </g>
  </g>
</svg>
